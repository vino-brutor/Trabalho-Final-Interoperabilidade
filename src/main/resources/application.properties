spring.application.name=ambulatorio-fhir
server.port=8080

# Banco em memoria, recriado a cada inicializacao a partir de data.sql
spring.datasource.url=jdbc:h2:mem:ambulatorio;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datas da API proprietaria no formato ISO 8601
spring.jackson.serialization.write-dates-as-timestamps=false
